[tools]
rust = { version = "1.100.0", components = "rustfmt,clippy,llvm-tools" }
just = "1.59.0"
"cargo:cargo-audit" = "0.22.2"
"aqua:EmbarkStudios/cargo-deny" = "0.22.1"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.2"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.33.1"

[env]
# gilrs needs libudev headers on Linux. On Bluefin they come from the keg-only
# Homebrew systemd formula; on other systems the extra path is simply absent.
PKG_CONFIG_PATH = "/home/linuxbrew/.linuxbrew/opt/systemd/lib/pkgconfig:/home/linuxbrew/.linuxbrew/opt/alsa-lib/lib/pkgconfig:{{ get_env(name='PKG_CONFIG_PATH', default='') }}"
