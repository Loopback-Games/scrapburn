# SonarQube Cloud, CI-based analysis (.github/workflows/sonar.yml).
# Automatic analysis must stay off for this project, or CI analyses fail.
sonar.organization=loopback-games
sonar.projectKey=Loopback-Games_scrapburn
sonar.projectName=Scrapburn
sonar.sourceEncoding=UTF-8

sonar.sources=crates,game,tools
sonar.exclusions=**/*_test.go
sonar.tests=tools/tailcat
sonar.test.inclusions=**/*_test.go

# Written by `just sonar-reports`.
sonar.rust.clippyReport.reportPaths=target/sonar/clippy.json
sonar.rust.lcov.reportPaths=target/sonar/lcov.info
sonar.go.coverage.reportPaths=target/sonar/go-coverage.out
