name: release

# Push a tag vX.Y.Z that matches the workspace version in Cargo.toml and sits on main.
# The in-game updater installs whatever this publishes as the latest release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag matches Cargo.toml and is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the workspace version $version"
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$TAG is not on main"
            exit 1
          }

  package:
    needs: verify
    strategy:
      matrix:
        # Linux builds against glibc 2.28 in podman; Windows builds natively (MSVC).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # package.py names the archive with `git describe --tags`.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # Release builds never restore a cache another branch could have written.
          cache: false
      - name: Install the helper's Go toolchain
        run: mise --cd tools/tailcat install
      - run: just package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}
          path: target/dist/*.zip
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.zip > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Scrapburn $TAG" \
            --generate-notes
