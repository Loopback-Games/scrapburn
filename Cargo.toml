[workspace]
resolver = "3"
members = ["crates/*", "game/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/loopback-games/rivet"

[workspace.dependencies]
rivet-core = { path = "crates/rivet-core" }
rivet-platform = { path = "crates/rivet-platform" }
rivet-render = { path = "crates/rivet-render" }
rivet-physics = { path = "crates/rivet-physics" }
wgpu = "30.0.2"
winit = "0.30.13"
glam = { version = "0.34.3", features = ["bytemuck"] }
gilrs = "0.11.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.3"
log = "0.4.35"
env_logger = "0.11.12"
anyhow = "1.0.105"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
