[workspace]
resolver = "3"
members = ["crates/*", "game/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/Loopback-Games/scrapburn"

[workspace.dependencies]
rivet-core = { path = "crates/rivet-core" }
rivet-platform = { path = "crates/rivet-platform" }
rivet-render = { path = "crates/rivet-render" }
rivet-physics = { path = "crates/rivet-physics" }
rivet-assets = { path = "crates/rivet-assets" }
rivet-ai = { path = "crates/rivet-ai" }
rivet-audio = { path = "crates/rivet-audio" }
rivet-net = { path = "crates/rivet-net" }
wgpu = "30.0.2"
winit = "0.30.13"
glam = { version = "0.34.3", features = ["bytemuck"] }
gilrs = "0.11.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.3"
log = "0.4.35"
env_logger = "0.11.12"
anyhow = "1.0.105"
thiserror = "2.0.21"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde_json = "1.0.154"
cpal = "0.18.2"
fontdue = "0.9.5"
# Text only: copy and paste private-race invites.
arboard = { version = "3.7.0", default-features = false }
# In-game updater: HTTPS to GitHub Releases, verified with the OS trust store.
ureq = { version = "3.5.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11.2"
flate2 = "1.1.11"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
